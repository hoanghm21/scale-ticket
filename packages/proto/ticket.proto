syntax = "proto3";

package scaleticket.ticket.v1;

option go_package = "github.com/scale-ticket/ticket/pkg/api/v1";

service TicketService {
  rpc ReserveSeat(ReserveSeatRequest) returns (ReserveSeatResponse);
  rpc PurchaseTickets(PurchaseTicketsRequest) returns (PurchaseTicketsResponse);
  rpc GetEventSeatAvailability(GetEventSeatAvailabilityRequest) returns (GetEventSeatAvailabilityResponse);
}

message ReserveSeatRequest {
  string event_id = 1;
  string user_id = 2;
  string seat_id = 3;
}

message ReserveSeatResponse {
  bool success = 1;
  string reservation_id = 2;
  string expires_at = 3;
  string error_message = 4;
}

message PurchaseTicketsRequest {
  string event_id = 1;
  string user_id = 2;
  repeated string seat_ids = 3;
  string payment_intent_id = 4;
}

message PurchaseTicketsResponse {
  bool success = 1;
  repeated string ticket_ids = 2;
  string error_message = 3;
}

message GetEventSeatAvailabilityRequest {
  string event_id = 1;
}

message GetEventSeatAvailabilityResponse {
  string event_id = 1;
  repeated SeatStatus seats = 2;
}

message SeatStatus {
  string seat_id = 1;
  string status = 2; // "available", "locked", "sold"
}
